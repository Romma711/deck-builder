# Entorno local/desarrollo: API + PostgreSQL 18.
#
# IMPORTANTE: la app conecta como rol NO superusuario
# (deckbuilder, dueño de la BD creada en init.sql). RLS solo aplica a roles
# no-superusuario: si la app conectara como superusuario, el aislamiento de
# mazos privados/de org quedaría anulado.
#
# Uso:
#   cp .env.example .env   # completar SECRET_SIGNING_KEY
#   docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Postgres 18+: el mount va en /var/lib/postgresql (los datos viven en un
      # subdirectorio con el mayor versión; montar .../data directo ya no arranca).
      - pgdata:/var/lib/postgresql
      # Crea el rol no-superusuario y la BD de la app en el primer arranque.
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://deckbuilder:deckbuilder@db:5432/deckbuilder?sslmode=disable
      # Obligatoria: definila en .env (no uses la de ejemplo en ningún entorno real).
      SECRET_SIGNING_KEY: ${SECRET_SIGNING_KEY:?definí SECRET_SIGNING_KEY en .env}
      # Opcional: orígenes del navegador separados por coma (vacío = none).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      RATE_LIMIT_AUTH_RPS: ${RATE_LIMIT_AUTH_RPS:-5}
      RATE_LIMIT_AUTH_BURST: ${RATE_LIMIT_AUTH_BURST:-10}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
